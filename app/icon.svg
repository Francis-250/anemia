<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ef4444" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Blood drop -->
  <path d="M256 70 C256 70 120 250 120 340 A136 136 0 0 0 392 340 C392 250 256 70 256 70 Z" 
        fill="url(#dropGrad)" 
        filter="url(#shadow)" />

  <!-- Medical Cross inside blood drop -->
  <path d="M232 245 H280 V290 H325 V338 H280 V385 H232 V338 H187 V290 H232 Z" 
        fill="#ffffff" />
</svg>
